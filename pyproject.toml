[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-assistant"
version = "0.1.0"
description = "银行内部坐席辅助与会后文本质检（个人展示项目，全部为合成数据）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-json-logger>=3.0",
    "loguru>=0.7",
    "tenacity>=8.5",
    "aiofiles>=24.1",
    "httpx>=0.27",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "dashscope>=1.20",
    "openai>=1.40",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
]
# T28（#29）条件任务的可选训练依赖。默认 `uv sync` 不安装它们；只有真正要
# 训练/做 tiny CPU smoke 时才 `uv sync --group train`。8GB 卡用 bitsandbytes
# 4-bit QLoRA，因此只在 Linux 安装 bitsandbytes。
train = [
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
    "peft>=0.14,<1",
    "accelerate>=1.3,<2",
    "bitsandbytes>=0.45,<1; sys_platform == 'linux'",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q -m 'not integration'"
norecursedirs = ["archive", ".venv", "web", "node_modules"]
markers = [
    "integration: 需要真实 PostgreSQL 容器，由 make test-integration 运行（默认排除）",
]

[tool.uv]
package = true
