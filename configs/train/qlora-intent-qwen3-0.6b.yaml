# M6 条件任务：Qwen3-0.6B 4-bit QLoRA 意图分类（T28，#29）
#
# 8GB RTX 3060 Ti 约束（ADR-0004）：4-bit + batch=1 + 梯度检查点 + 梯度累积。
# 默认只跑 dry-run；--execute 才会训练，且先过 GPU 资源闸门。
#
# 用法：
#   uv run python -m scripts.train_intent_lora --config configs/train/qlora-intent-qwen3-0.6b.yaml --dry-run
#   uv run python -m scripts.train_intent_lora --config configs/train/qlora-intent-qwen3-0.6b.yaml --execute
#
# 标签是 business_type（lost_card / credit_card_fee / complaint）：数据集里唯一
# 跨 train/dev/test 不重叠的意图标签。细粒度 intent_cluster 不能做监督目标。

run:
  artifact_root: artifacts/training
  seed: 42
  run_id: null

dataset:
  dataset_id: bank-cs-m6-synthetic
  dataset_version: v1
  dataset_dir: artifacts/data/bank-cs-m6-synthetic/v1
  split: train                 # 训练只允许 train；dev/test 会被 split_guard 拒绝
  task: retrieval
  text_field: query
  label_field: business_type

model:
  name: Qwen/Qwen3-0.6B
  revision: main
  license: Apache-2.0
  parameter_count_b: 0.6
  provider: local_model
  trust_remote_code: false

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

training:
  max_seq_length: 512         # dry-run 用真实 tokenizer 实测后可下调
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  gradient_checkpointing: true
  logging_steps: 5
  max_steps: -1
  bf16: true

evaluation:
  split: test                 # 只允许冻结 test；不使用 dev 出正式结论
  batch_size: 1
  max_new_tokens: 8
  prompt_version: intent-routing-v1

hardware:
  require_cuda: true
  min_total_vram_gib: 8.0
  min_free_vram_gib: 2.0
  allow_time_sharing: false   # 与 dingtalk-* 共享需要负责人明确同意
