# M6 条件任务：Qwen3-1.7B 4-bit QLoRA 意图分类（T28，#29）
#
# 备用候选：比 0.6B 更贴近 8GB 上限。只有 0.6B 条件实验跑通、且负责人
# 同意占用 GPU 窗口后才考虑；默认同样是 dry-run。
#
# 用法：
#   uv run python -m scripts.train_intent_lora --config configs/train/qlora-intent-qwen3-1.7b.yaml --dry-run

run:
  artifact_root: artifacts/training
  seed: 42
  run_id: null

dataset:
  dataset_id: bank-cs-m6-synthetic
  dataset_version: v1
  dataset_dir: artifacts/data/bank-cs-m6-synthetic/v1
  split: train
  task: retrieval
  text_field: query
  label_field: business_type

model:
  name: Qwen/Qwen3-1.7B
  revision: main
  license: Apache-2.0
  parameter_count_b: 1.7
  provider: local_model
  trust_remote_code: false

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

training:
  max_seq_length: 512
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 2
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  gradient_checkpointing: true
  logging_steps: 5
  max_steps: -1
  bf16: true

evaluation:
  split: test
  batch_size: 1
  max_new_tokens: 8
  prompt_version: intent-routing-v1

hardware:
  require_cuda: true
  min_total_vram_gib: 8.0
  min_free_vram_gib: 2.0
  allow_time_sharing: false
