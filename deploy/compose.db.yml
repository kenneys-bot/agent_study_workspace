# PostgreSQL 18：唯一实例部署在 Ubuntu（ADR-0006）。
#
# 用法（服务器）：
#   docker compose -p bank-assistant-db \
#     --env-file ~/workspace/bank-assistant/.env.pg \
#     -f deploy/compose.db.yml up -d
#
# 约束：
# - 端口只绑 127.0.0.1:5432（仅回环），不暴露到局域网/公网；远程访问一律走 SSH 隧道。
# - 数据目录由 PG_DATA_DIR 显式指定（服务器为 ~/workspace/bank-assistant/data/pg），
#   不再使用匿名/项目私有卷，避免 `down -v` 误删数据。
# - 凭据只从 env-file 读取，文件在仓库外、chmod 600；仓库里没有任何真实凭据。
# - Mac 不再用本文件起数据库；本文件只用于 Ubuntu。`make test-e2e` 的历史隔离路径
#   仍会临时复用，但它显式提供自己的 PG_DATA_DIR/凭据，见 scripts/test-e2e.sh。
name: bank-assistant-db

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      # 没有 env-file 时直接拒绝启动，避免退回任何内置弱口令。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须由 --env-file 或环境变量提供}
      POSTGRES_DB: ${POSTGRES_DB:-bank_assistant_dev}
    ports:
      # 只绑服务器回环，不暴露到局域网。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 起 PGDATA 在 /var/lib/postgresql/<major>/docker，
      # 因此挂到父目录 /var/lib/postgresql（官方镜像的 VOLUME 位置）。
      # 宿主目录必须存在且属主为容器用户（postgres:18-alpine 为 uid 70）。
      - "${PG_DATA_DIR:?PG_DATA_DIR 必须指向服务器数据目录}:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
